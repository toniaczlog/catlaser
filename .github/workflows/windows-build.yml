name: CatLaser 0.2.1 Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catlaser-v021
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test Polish and English localization
        shell: pwsh
        run: |
          dotnet run --project tests/LocalizationSmoke/LocalizationSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          dotnet publish CatLaser/CatLaser.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/CatLaser.exe)) { throw 'Missing Windows executable' }
          $exe = Get-Item dist/CatLaser.exe
          if ($exe.Length -lt 1000000) { throw 'Unexpectedly small executable' }
          Compress-Archive -Path dist/* -DestinationPath CatLaser-0.2.1-win-x64.zip -Force
          if (!(Test-Path CatLaser-0.2.1-win-x64.zip)) { throw 'Missing archive' }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatLaser-0.2.1-win-x64
          path: CatLaser-0.2.1-win-x64.zip
          if-no-files-found: error

      - name: Publish CatLaser 0.2 preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.2.1 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.2.1 CatLaser-0.2.1-win-x64.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "CatLaser 0.2.1 · Polski / English" --notes "Polish automatically selected on Polish Windows, English fallback, persistent manual PL/EN switch, localized tray and compact six-section dashboard. Same laser engine as 0.2. Windows 10/11 x64 portable. Preview: GUI smoke test pending. Not code-signed." --prerelease
          } else {
            gh release upload v0.2.1 CatLaser-0.2.1-win-x64.zip --repo "${{ github.repository }}" --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
