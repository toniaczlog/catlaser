name: CatLaser 0.3 Windows release

on:
  push:
    branches: [main]
    paths:
      - 'CatLaser/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catlaser-v030
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test Polish and English localization
        shell: pwsh
        run: |
          dotnet run --project tests/LocalizationSmoke/LocalizationSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test playlists and hotkey settings
        shell: pwsh
        run: |
          dotnet run --project tests/ConfigSmoke/ConfigSmoke.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build portable Windows app
        shell: pwsh
        run: |
          dotnet publish CatLaser/CatLaser.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=none --output dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path dist/CatLaser.exe)) { throw 'Missing Windows executable' }
          $exe = Get-Item dist/CatLaser.exe
          if ($exe.Length -lt 1000000) { throw 'Unexpectedly small executable' }
          Compress-Archive -Path dist/* -DestinationPath CatLaser-0.3-win-x64.zip -Force
          if (!(Test-Path CatLaser-0.3-win-x64.zip)) { throw 'Missing archive' }

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: CatLaser-0.3-win-x64
          path: CatLaser-0.3-win-x64.zip
          if-no-files-found: error

      - name: Publish CatLaser 0.2 preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.3.0 --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create v0.3.0 CatLaser-0.3-win-x64.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "CatLaser 0.3 · Playlists & Laser Illusions" --notes "Playlists, bounded multi-monitor play area, spirals/orbit/eight movement, four gentler light illusions, fullscreen auto-pause, user-adjustable shortcuts and expanded tray controls. PL/EN. Portable Windows 10/11 x64. Preview: needs real-device UI test. Not code-signed." --prerelease
          } else {
            gh release upload v0.3.0 CatLaser-0.3-win-x64.zip --repo "${{ github.repository }}" --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
