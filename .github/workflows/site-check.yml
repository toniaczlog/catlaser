name: CatLaser landing validation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/check-site.mjs'
      - '.github/workflows/site-check.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'scripts/check-site.mjs'
      - '.github/workflows/site-check.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate bilingual static website
        run: |
          node --check docs/main.js
          node scripts/check-site.mjs
